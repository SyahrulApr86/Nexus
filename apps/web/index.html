<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-latin-wght-normal.woff2"
      crossorigin
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0b5cd6" />
    <meta
      name="description"
      content="A keyboard-first Markdown workspace in the browser. Wikilinks weave your notes into a graph; the server keeps every device on the same page."
    />
    <script>
      // Apply theme before first paint to avoid flash (US9-S1: OS default)
      (function () {
        var stored = localStorage.getItem("nexus-theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
