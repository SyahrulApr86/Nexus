name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_dev
          POSTGRES_DB: nexus
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U nexus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
      mailpit:
        image: axllent/mailpit:latest
        ports: ["8025:8025", "1025:1025"]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @nexus/server db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apply migrations for e2e
        run: pnpm --filter @nexus/server db:deploy
        env:
          DATABASE_URL: postgresql://nexus:nexus_dev@localhost:5433/nexus
      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: E2E + accessibility audit
        run: pnpm test:e2e
        env:
          CI: "1"
